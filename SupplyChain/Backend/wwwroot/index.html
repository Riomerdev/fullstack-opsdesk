<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SupplyChain Control Tower</title><link rel="stylesheet" href="/styles.css"></head>
<body><header><a class="brand" href="/">NORTH / CONTROL</a><span><i></i> Datos operativos</span></header>
<main><section class="hero"><div><p class="eyebrow">SUPPLY CHAIN VISIBILITY</p><h1>Entiende cada movimiento de tu carga.</h1><p>Eventos trazables y una estimación de riesgo ETA que explica sus señales.</p></div><div class="route-mark">→</div></section>
<section class="stats"><article><span>En tránsito</span><strong id="moving">—</strong></article><article><span>Con alerta ETA</span><strong id="risk">—</strong></article><article><span>Último cálculo Python</span><strong id="evaluated">Pendiente</strong></article></section>
<div class="columns"><section class="panel"><div class="heading"><div><p class="eyebrow">TRACKING BOARD</p><h2>Envíos</h2></div><button id="refresh">Actualizar</button></div><div id="shipments" class="shipments"></div></section>
<aside class="panel"><p class="eyebrow">NUEVA ORDEN</p><h2>Registrar despacho</h2><form id="shipment-form">
<label>Referencia<input name="orderReference" required maxlength="40" placeholder="PO-2026-0412"></label><label>Transportista<input name="carrier" required maxlength="60" placeholder="Operador logístico"></label>
<label>Origen<input name="origin" required maxlength="80" placeholder="Chapecó, SC"></label><label>Destino<input name="destination" required maxlength="80" placeholder="Curitiba, PR"></label>
<label>ETA planificada (UTC)<input name="plannedArrival" type="datetime-local" required></label><button class="primary">Crear envío</button><p id="notice" role="status"></p></form></aside></div></main>
<script src="/app.js" defer></script></body></html>
