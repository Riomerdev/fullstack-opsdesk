name: Full-stack portfolio quality
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Compile API projects
        run: |
          dotnet build OpsDesk/Backend/OpsDesk.Api.csproj --configuration Release
          dotnet build SupplyChain/Backend/SupplyChain.Api.csproj --configuration Release
      - name: Check worker syntax
        run: python -m compileall -q OpsDesk/Worker SupplyChain/Worker
      - name: Check browser JavaScript syntax
        run: |
          node --check OpsDesk/Backend/wwwroot/app.js
          node --check SupplyChain/Backend/wwwroot/app.js